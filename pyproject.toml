[project]
name = "workflow-processor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "LicenseRef-SaaS-Commercial-Restriction-1.0"
requires-python = ">=3.14"
dependencies = [
    "cssselect>=1.4.0",
    "fastapi>=0.136.3",
    "lxml>=6.1.0",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "nvidia-ml-py>=13.595.45",
    "pillow>=12.2.0",
    "polars>=1.40.1",
    "psutil>=7.2.2",
    "pynvml>=13.0.1",
    "pyrefly>=0.61.0",
    "python-multipart>=0.0.32",
    "types-networkx>=3.6.1.20260408",
    "uvicorn>=0.49.0",
    "websockets>=16.0",
    "wmi>=1.5.1 ; sys_platform == 'win32'",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.uv.pip]
only-binary = ["polars", "pyrefly", "lxml"]
